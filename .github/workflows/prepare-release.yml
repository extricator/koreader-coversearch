name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version_selection:
        description: 'Version selection (ignored when Custom version is filled)'
        required: true
        type: choice
        default: Automatic
        options:
          - Automatic
          - Use code version
          - Patch
          - Minor
          - Major
      custom_version:
        description: 'Custom version — optional X.Y.Z override, without v'
        required: false
        type: string
      prerelease:
        description: 'Mark as a prerelease for testing'
        type: boolean
        default: false
      result:
        description: 'Result: draft for review, or publish immediately'
        required: true
        type: choice
        default: Draft release
        options:
          - Draft release
          - Publish immediately

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION_SELECTION: ${{ inputs.version_selection }}
      CUSTOM_VERSION: ${{ inputs.custom_version }}
      PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_RESULT: ${{ inputs.result }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require the main branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Run Prepare release on the main branch.' >&2
            exit 1
          fi
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y luajit zip unzip jq
      - name: Select version and commit metadata locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/resolve-release.sh
      - name: Check Lua and run tests
        run: bash tools/check.sh
      - name: Verify release packaging
        run: bash tests/package.sh
      - name: Verify release automation
        run: |
          bash tests/release-version.sh
          bash tests/release.sh
      - name: Build release ZIP and checksum
        run: |
          bash tools/package.sh "$RELEASE_TAG"
          {
            printf 'SHA-256:\n```\n'
            cat dist/*.sha256
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Push the verified version commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/push-release-version.sh
      - name: Record release source provenance
        run: bash tools/release-provenance.sh
      - name: Attest the public build
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.zip
          create-storage-record: false
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: dist/provenance.json
      - name: Create release with the selected publication settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/prepare-release.sh "$RELEASE_TAG"
