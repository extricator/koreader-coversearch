name: Check plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y luajit zip unzip
      - name: Check Lua and run tests
        run: bash tools/check.sh
      - name: Verify release packaging
        run: bash tests/package.sh
